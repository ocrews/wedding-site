name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  pii-guard:
    name: PII guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @wedding/pii-guard --filter wedding-site
      - name: Scan tracked files for real wedding/guest data
        run: pnpm pii-guard
        env:
          # Private real-name/place denylist. Never committed; hits are reported without the term.
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
          # Flip to '1' (repo variable) once the secret exists so a missing list fails CI.
          PII_DENYLIST_REQUIRED: ${{ vars.PII_DENYLIST_REQUIRED || '0' }}

  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/smoke.sh

  infra-lint:
    name: infra lint (terraform · ansible · shell · images)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff infra/terraform
      - name: terraform validate
        run: |
          for env in infra/terraform/envs/*/; do
            echo "== $env"
            terraform -chdir="$env" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$env" validate -no-color
          done
      - name: ansible-lint
        run: |
          pipx install --include-deps "ansible-core>=2.18,<2.20"
          pipx inject ansible-core ansible-lint
          cd infra/ansible
          ansible-lint --offline bootstrap.yml site.yml
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/ci/*.sh infra/ansible/roles/edge/files/wedding-deploy
      - name: Pinned images exist
        run: |
          imgs=$(grep -hoE '[a-z0-9./-]+:[A-Za-z0-9._-]+' infra/ansible/roles/edge/defaults/main.yml)
          imgs+=" $(grep -hoE 'image: [a-z0-9./-]+:[A-Za-z0-9._-]+$' deploy/compose.app.yaml | cut -d' ' -f2)"
          for img in $imgs; do
            docker manifest inspect "$img" >/dev/null && echo "ok   $img" || { echo "::error::image tag not found: $img"; exit 1; }
          done
      - name: App compose renders
        run: |
          STACK=pr-1 SITE_HOST=pr-1.example.test IMAGE_TAG=test REGISTRY=ghcr.io/example/x POSTGRES_PASSWORD=x \
            docker compose -f deploy/compose.app.yaml -p pr-1 config -q
