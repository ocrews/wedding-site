name: Infra

# Terraform (DigitalOcean + Cloudflare) then Ansible (host config), per stack.
#  - PRs touching infra/: plan staging, summary in the job (no changes made).
#  - Manual run: plan or apply a chosen stack. Production waits for approval (environment rule).
on:
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      stack:
        description: Stack
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: plan shows changes; apply makes them and configures the host
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.stack || 'staging' }}
  cancel-in-progress: false

jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stack || 'staging' }}
    env:
      STACK: ${{ inputs.stack || 'staging' }}
      ACTION: ${{ inputs.action || 'plan' }}
      # Providers
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # State backend (R2)
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      # Inputs (all from GitHub variables; nothing real in the repo)
      TF_VAR_domain: ${{ vars.SITE_DOMAIN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_launched: ${{ vars.PROD_LAUNCHED || 'false' }}
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.stack || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Check required settings
        id: check
        working-directory: .
        env:
          ACCESS_EMAILS: ${{ vars.ACCESS_EMAILS }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
        run: |
          missing=()
          for v in DIGITALOCEAN_TOKEN CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                   TF_VAR_domain TF_VAR_cloudflare_account_id TF_VAR_cloudflare_zone_id TF_VAR_ssh_public_key ACCESS_EMAILS; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              echo "::notice::Plan skipped: settings not configured yet (${missing[*]}). See infra/README.md."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Missing settings for '$STACK': ${missing[*]}. See infra/README.md."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          # Comma-separated → JSON list for Terraform.
          to_json() { jq -cR 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' <<<"$1"; }
          emails=$(to_json "$ACCESS_EMAILS")
          alerts=$(to_json "${ALERT_EMAILS:-$ACCESS_EMAILS}")
          echo "::add-mask::$emails"
          echo "::add-mask::$alerts"
          { echo "TF_VAR_access_emails=$emails"; echo "TF_VAR_alert_emails=$alerts"; } >> "$GITHUB_ENV"

      - name: Init
        if: steps.check.outputs.ok == 'true'
        run: |
          terraform init \
            -backend-config="bucket=wedding-tfstate" \
            -backend-config="endpoints={s3=\"https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com\"}"

      - name: Plan
        if: steps.check.outputs.ok == 'true'
        id: plan
        run: |
          set -o pipefail
          terraform plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan: $STACK"
            echo '```'
            grep -E '^(  # |Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: env.ACTION == 'apply'
        run: terraform apply -lock-timeout=5m -no-color tfplan

      - name: Read outputs
        id: out
        if: env.ACTION == 'apply'
        run: |
          token=$(terraform output -raw tunnel_token)
          echo "::add-mask::$token"
          umask 077
          printf 'tunnel_token: "%s"\n' "$token" > "$RUNNER_TEMP/ansible-vars.yml"
          ip=$(terraform output -raw ipv4)
          echo "::add-mask::$ip"   # public repo: workflow logs are public
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        if: env.ACTION == 'apply'
        working-directory: .
        run: pipx install --include-deps "ansible-core>=2.18,<2.20"

      - name: SSH key
        if: env.ACTION == 'apply'
        working-directory: .
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key

      - name: Configure host (Ansible)
        if: env.ACTION == 'apply'
        working-directory: infra/ansible
        env:
          IP: ${{ steps.out.outputs.ip }}
        run: |
          export ANSIBLE_PRIVATE_KEY_FILE="$HOME/.ssh/deploy_key"
          # Wait for SSH on a fresh droplet.
          for i in $(seq 1 30); do nc -z -w 3 "$IP" 22 && break; sleep 5; done
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10)
          if ssh "${ssh_opts[@]}" "deploy@$IP" true 2>/dev/null; then
            playbook=site.yml; user=deploy
          else
            echo "deploy user not ready; bootstrapping as root"
            playbook=bootstrap.yml; user=root
          fi
          ansible-playbook -i "$IP," -u "$user" "$playbook" -e "@$RUNNER_TEMP/ansible-vars.yml"

      - name: Clean up secrets
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/ansible-vars.yml" ~/.ssh/deploy_key infra/terraform/envs/*/tfplan

      - name: Next step
        if: env.ACTION == 'apply'
        working-directory: .
        run: |
          var=$([[ "$STACK" == production ]] && echo PRODUCTION_READY || echo STAGING_READY)
          echo "Host ready. If not already set, add repo variable $var=true to enable deploys." >> "$GITHUB_STEP_SUMMARY"
