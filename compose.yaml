# Local development stack (also used by the CI smoke test).
# Works with zero config; copy .env.example to .env to override.
# Fake data only. Staging/prod compose files arrive with the deploy PR.
name: wedding

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-wedding}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { APP: api }
    environment:
      <<: *node-env
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-wedding}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-wedding}
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/readyz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args: { APP: worker }
    environment:
      <<: *node-env
      HEALTH_PORT: 4100
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_URL: http://api:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  redisdata:
