[defaults]
roles_path = ./roles
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 5
retry_files_enabled = false
# Never print task args (they can hold the tunnel token).
display_args_to_stdout = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15
