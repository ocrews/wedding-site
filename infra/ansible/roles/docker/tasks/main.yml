- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Docker apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker daemon config (bounded logs)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "local",
        "log-opts": { "max-size": "20m", "max-file": "5" },
        "live-restore": true
      }
    mode: '0644'
  notify: Restart docker

- name: Deploy user may run docker
  ansible.builtin.user:
    name: deploy
    groups: [docker]
    append: true

- name: Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Weekly prune of unused images
  ansible.builtin.copy:
    dest: /etc/cron.weekly/docker-prune
    content: |
      #!/bin/sh
      docker image prune -af --filter "until=168h" >/dev/null 2>&1
    mode: '0755'
